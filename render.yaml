services:
  - type: web
    name: omnibrain-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    # Persistent disks require a paid Render plan.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: VECTOR_SIZE
        value: "768"
      - key: PINECONE_INDEX_NAME
        value: omnibrain-documents-gemini
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: PINECONE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: omnibrain-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
